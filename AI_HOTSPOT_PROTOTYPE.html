<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI Hotspot 高保真产品原型：公开 AI 情报、事件、报告、RAG、邮件订阅、Agent 与管理工作区。" />
  <title>AI Hotspot · AI 情报与知识研究</title>
  <style>
    :root {
      --bg: #f4f6f7;
      --surface: #ffffff;
      --surface-2: #f8fafb;
      --surface-3: #eef3f4;
      --text: #14262d;
      --muted: #74868e;
      --subtle: #9aa8ae;
      --border: #dde5e8;
      --accent: #0b6c73;
      --accent-2: #16868e;
      --accent-soft: #e8f3f4;
      --warning: #a56f23;
      --warning-soft: #fff9ef;
      --danger: #b65252;
      --danger-soft: #fff2f2;
      --success: #2c7a63;
      --shadow: 0 1px 2px rgba(17, 38, 46, .04), 0 4px 14px rgba(17, 38, 46, .035);
      --sidebar: 188px;
      --radius: 12px;
      --radius-sm: 8px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
    }

    html[data-theme="dark"] {
      --bg: #11181b;
      --surface: #182226;
      --surface-2: #1d292e;
      --surface-3: #243238;
      --text: #e7eff1;
      --muted: #9bb0b7;
      --subtle: #728890;
      --border: #2d3c42;
      --accent: #54b3b8;
      --accent-2: #7fcbd0;
      --accent-soft: #20383b;
      --warning-soft: #332b1f;
      --danger-soft: #392425;
      --shadow: none;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    .hidden { display: none !important; }
    .muted { color: var(--muted); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    .app { min-height: 100vh; }
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: var(--sidebar);
      z-index: 40;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-right: 1px solid var(--border);
      transition: width .2s ease;
    }
    .brand {
      height: 94px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 2px;
      border-bottom: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      border-top: 0;
      border-left: 0;
      border-right: 0;
      letter-spacing: .18em;
      font-weight: 760;
      font-size: 18px;
    }
    .brand span:last-child { color: var(--accent); }
    .brand-orbit {
      width: 12px;
      height: 12px;
      border: 2px solid var(--accent);
      border-radius: 50%;
      display: inline-block;
      position: relative;
      margin: 0 2px;
    }
    .brand-orbit::after {
      content: "";
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
      right: -4px;
      top: -3px;
    }
    .nav { flex: 1; overflow: auto; padding: 14px 10px; }
    .nav-section { margin-bottom: 18px; }
    .nav-label {
      padding: 0 10px 7px;
      font-size: 10px;
      color: var(--subtle);
      letter-spacing: .12em;
    }
    .nav-item {
      width: 100%;
      height: 38px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 0;
      border-radius: 8px;
      padding: 0 10px;
      color: var(--muted);
      background: transparent;
      text-align: left;
      margin-bottom: 3px;
      font-size: 13px;
    }
    .nav-item:hover { color: var(--text); background: var(--surface-2); }
    .nav-item.active { color: var(--accent); background: var(--accent-soft); font-weight: 650; }
    .nav-icon {
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 18px;
    }
    .nav-icon svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .sidebar-bottom { border-top: 1px solid var(--border); padding: 10px; }
    .theme-row { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; padding: 4px; background: var(--surface-3); border-radius: 10px; }
    .theme-btn { border: 0; background: transparent; color: var(--muted); padding: 7px; border-radius: 7px; }
    .theme-btn.active { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
    .admin-switch { width: 100%; margin-top: 9px; border: 0; background: transparent; color: var(--muted); padding: 7px; font-size: 11px; }

    .main { margin-left: var(--sidebar); min-height: 100vh; }
    .page { display: none; }
    .page.active { display: block; }
    .page-shell { max-width: 1540px; margin: 0 auto; padding: 0 28px 60px; }
    .page-header {
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .page-header h1 { margin: 0 0 7px; font-size: 24px; letter-spacing: -.02em; }
    .page-header p { margin: 0; color: var(--muted); font-size: 12px; }
    .header-actions { display: flex; gap: 9px; align-items: center; }
    .btn {
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 13px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      white-space: nowrap;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
    .btn.primary:hover { background: var(--accent-2); color: white; }
    .btn.danger { color: var(--danger); }
    .btn.small { height: 29px; padding: 0 9px; font-size: 11px; }
    .btn.icon { width: 36px; padding: 0; }
    .icon-svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .tabs { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
    .tab {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 9px 10px;
      border-bottom: 2px solid transparent;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 650; }
    .search { margin-left: auto; position: relative; min-width: 290px; }
    .search input {
      width: 100%; height: 36px; border: 1px solid var(--border); background: var(--surface); color: var(--text);
      border-radius: 8px; padding: 0 39px 0 13px; outline: 0;
    }
    .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .search button { position: absolute; right: 3px; top: 3px; width: 30px; height: 30px; border: 0; background: transparent; color: var(--muted); }

    .hot-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 26px; overflow: hidden; }
    .panel-title { height: 42px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid var(--border); font-weight: 700; }
    .panel-title small { color: var(--muted); font-weight: 400; }
    .hot-row { width: 100%; min-height: 42px; display: grid; grid-template-columns: 26px 1fr 130px; align-items: center; gap: 8px; padding: 0 15px; border: 0; border-top: 1px solid var(--border); background: transparent; color: var(--text); text-align: left; }
    .hot-row:hover, .hot-row:focus-visible { background: var(--accent-soft); outline: none; }
    .hot-row:first-of-type { border-top: 0; }
    .hot-rank { color: #c56d2b; font-weight: 800; }
    .hot-title { font-size: 13px; font-weight: 620; }
    .hot-row small { color: var(--muted); text-align: right; }

    .date-heading { margin: 20px 0 15px 5px; font-size: 17px; display: flex; gap: 9px; align-items: center; }
    .date-heading small { font-size: 11px; color: var(--muted); font-weight: 400; }
    .timeline { position: relative; }
    .timeline::before { content: ""; position: absolute; left: 64px; top: 5px; bottom: 12px; width: 1px; background: var(--border); }
    .timeline-row { display: grid; grid-template-columns: 64px 1fr; gap: 15px; margin-bottom: 12px; position: relative; }
    .time-col { padding-top: 13px; text-align: right; color: #62767f; font-size: 10px; font-weight: 650; position: relative; }
    .time-col::after { content: ""; position: absolute; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); right: -19px; top: 17px; border: 3px solid var(--bg); }
    .article-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 15px 16px 13px; position: relative; transition: transform .15s ease, border-color .15s ease; }
    .article-card:hover { transform: translateY(-1px); border-color: #c4d7db; }
    .article-top { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; }
    .source-dot { width: 26px; height: 26px; border-radius: 50%; background: var(--surface-3); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; }
    .source-type { color: var(--subtle); }
    .badge { display: inline-flex; align-items: center; border-radius: 5px; padding: 2px 6px; background: var(--warning-soft); color: var(--warning); font-size: 9px; font-weight: 650; }
    .score { margin-left: auto; color: var(--accent); font-weight: 750; font-size: 10px; }
    .bookmark { border: 0; background: transparent; color: var(--muted); width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; }
    .bookmark.active { color: var(--accent); }
    .article-title { margin: 11px 0 7px; font-size: 16px; line-height: 1.55; font-weight: 720; cursor: pointer; }
    .article-title:hover { color: var(--accent); }
    .article-summary { color: #596d75; line-height: 1.75; margin: 0; font-size: 12px; }
    html[data-theme="dark"] .article-summary { color: #a9bbc1; }
    .article-tags { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; color: var(--muted); font-size: 10px; }
    .reason { border-top: 1px dashed var(--border); margin-top: 11px; padding-top: 9px; color: #557d83; font-size: 10px; line-height: 1.65; }
    .reason strong { color: var(--accent); }

    .filter-row { display: flex; align-items: center; gap: 8px; padding: 11px 13px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .filter-row label { color: var(--muted); font-size: 11px; }
    .filter-row select { height: 31px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); color: var(--text); padding: 0 28px 0 9px; }
    .toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; }
    .toggle input { accent-color: var(--accent); }

    .report-hero { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); display: grid; grid-template-columns: 1.4fr .6fr; gap: 28px; padding: 30px; box-shadow: var(--shadow); margin-bottom: 18px; }
    .report-hero h2 { font-size: 27px; line-height: 1.45; margin: 0 0 10px; }
    .report-hero p { color: var(--muted); line-height: 1.8; }
    .report-metrics { border-left: 1px solid var(--border); padding-left: 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-content: center; }
    .metric { background: var(--surface-2); border-radius: 9px; padding: 13px; }
    .metric strong { font-size: 22px; display: block; }
    .metric span { color: var(--muted); font-size: 10px; }
    .report-list { display: grid; gap: 10px; }
    .report-row { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 15px 17px; display: grid; grid-template-columns: 90px 1fr 180px; gap: 15px; align-items: center; }
    .report-row h3 { margin: 0; font-size: 14px; }
    .report-row p { margin: 5px 0 0; color: var(--muted); font-size: 10px; }

    .topic-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .topic-card { border: 1px solid var(--border); background: var(--surface); border-radius: 11px; padding: 17px; text-align: left; }
    .topic-card:hover { border-color: var(--accent); }
    .topic-card h3 { margin: 0 0 16px; font-size: 15px; }
    .topic-stats { display: flex; justify-content: space-between; color: var(--muted); font-size: 10px; }
    .topic-feature { margin-top: 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 22px; display: grid; grid-template-columns: 1.2fr .8fr; gap: 25px; }
    .topic-feature h2 { margin: 0 0 7px; }
    .topic-feature p { color: var(--muted); line-height: 1.8; }
    .spark-bars { height: 150px; display: flex; align-items: end; gap: 6px; border-bottom: 1px solid var(--border); }
    .spark-bars i { flex: 1; background: var(--accent); opacity: .72; border-radius: 3px 3px 0 0; }

    .knowledge-shell { height: 100vh; display: grid; grid-template-rows: 96px 1fr; overflow: hidden; }
    .knowledge-header { padding: 0 25px; border-bottom: 1px solid var(--border); background: var(--bg); display: flex; align-items: center; justify-content: space-between; }
    .knowledge-header h1 { margin: 0 0 5px; font-size: 22px; }
    .knowledge-header p { margin: 0; color: var(--muted); font-size: 11px; }
    .knowledge-layout { min-height: 0; display: grid; grid-template-columns: 230px minmax(420px, 1fr) 300px; }
    .query-panel, .evidence-panel { background: var(--surface); overflow: auto; padding: 17px; }
    .query-panel { border-right: 1px solid var(--border); }
    .evidence-panel { border-left: 1px solid var(--border); }
    .panel-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .panel-heading h3 { margin: 0; font-size: 13px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; color: var(--muted); font-size: 10px; margin-bottom: 6px; }
    .form-group select, .form-group input { width: 100%; height: 35px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); color: var(--text); padding: 0 9px; }
    .check-list { display: grid; gap: 9px; color: var(--muted); font-size: 11px; }
    .check-list input { accent-color: var(--accent); }
    .chat-panel { min-width: 0; display: grid; grid-template-rows: 1fr auto; overflow: hidden; }
    .chat-messages { overflow: auto; padding: 25px max(30px, 7vw); }
    .chat-welcome { max-width: 650px; margin: 7vh auto 0; text-align: center; }
    .chat-welcome .orb { width: 52px; height: 52px; margin: 0 auto 17px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); display: flex; align-items: center; justify-content: center; color: var(--accent); box-shadow: var(--shadow); font-size: 20px; }
    .chat-welcome h2 { margin: 0 0 8px; font-size: 23px; }
    .chat-welcome p { color: var(--muted); line-height: 1.8; }
    .suggestions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 22px; }
    .suggestion { text-align: left; border: 1px solid var(--border); background: var(--surface); border-radius: 9px; padding: 11px; color: var(--muted); font-size: 11px; line-height: 1.55; }
    .suggestion:hover { color: var(--accent); border-color: var(--accent); }
    .message { max-width: 760px; margin: 0 auto 18px; }
    .message.user { display: flex; justify-content: flex-end; }
    .bubble { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 13px 15px; line-height: 1.8; box-shadow: var(--shadow); }
    .message.user .bubble { background: var(--accent); color: white; border-color: var(--accent); max-width: 75%; }
    .answer-title { font-weight: 750; margin-bottom: 8px; }
    .citation-chip { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); font-size: 9px; font-weight: 800; margin: 0 2px; }
    .chat-compose { padding: 13px max(25px, 7vw) 20px; background: linear-gradient(to top, var(--bg) 74%, transparent); }
    .compose-box { max-width: 850px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 13px; padding: 8px 8px 8px 14px; display: flex; align-items: end; gap: 8px; box-shadow: 0 8px 30px rgba(17,38,46,.08); }
    .compose-box textarea { flex: 1; border: 0; outline: 0; resize: none; background: transparent; color: var(--text); min-height: 44px; max-height: 130px; padding: 10px 0; line-height: 1.55; }
    .send-btn { width: 39px; height: 39px; border-radius: 9px; border: 0; background: var(--accent); color: white; }
    .evidence-card { border: 1px solid var(--border); border-radius: 9px; padding: 11px; margin-bottom: 9px; background: var(--surface-2); }
    .evidence-card strong { font-size: 11px; display: block; line-height: 1.45; }
    .evidence-card p { margin: 7px 0; color: var(--muted); font-size: 10px; line-height: 1.55; }
    .evidence-meta { display: flex; justify-content: space-between; color: var(--subtle); font-size: 9px; }
    .retrieval-steps { border-top: 1px solid var(--border); margin-top: 15px; padding-top: 14px; }
    .step { display: grid; grid-template-columns: 18px 1fr; gap: 8px; margin-bottom: 10px; font-size: 10px; color: var(--muted); }
    .step i { width: 17px; height: 17px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-style: normal; display: flex; align-items: center; justify-content: center; font-size: 9px; }

    .agent-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
    .agent-card { background: var(--surface); border: 1px solid var(--border); border-radius: 11px; padding: 17px; }
    .agent-card .agent-icon { width: 37px; height: 37px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; margin-bottom: 15px; font-weight: 800; }
    .agent-card h3 { margin: 0 0 8px; }
    .agent-card p { color: var(--muted); line-height: 1.7; font-size: 11px; min-height: 58px; }
    .agent-card .btn { width: 100%; }
    .run-table { margin-top: 18px; border: 1px solid var(--border); border-radius: 11px; overflow: hidden; background: var(--surface); }
    .table-title { padding: 14px 15px; font-weight: 700; border-bottom: 1px solid var(--border); }
    .run-row, .run-head { display: grid; grid-template-columns: minmax(190px,1.2fr) 100px 110px 85px 95px 45px; gap: 10px; align-items: center; padding: 0 14px; }
    .run-head { height: 37px; background: var(--surface-2); color: var(--muted); font-size: 9px; }
    .run-row { min-height: 55px; border-top: 1px solid var(--border); font-size: 10px; }
    .status { display: inline-flex; align-items: center; gap: 5px; width: max-content; font-size: 9px; }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--success); }
    .status.warning::before { background: #c88a35; }
    .status.error::before { background: var(--danger); }
    .status.manual::before { background: #74868e; }

    .admin-metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 11px; margin-bottom: 14px; }
    .admin-metric { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
    .admin-metric strong { display: block; font-size: 22px; }
    .admin-metric span { color: var(--muted); font-size: 10px; }
    .admin-toolbar { display: flex; gap: 9px; align-items: center; margin-bottom: 12px; }
    .admin-toolbar .search { margin-left: 0; min-width: 250px; flex: 1; }
    .data-table { background: var(--surface); border: 1px solid var(--border); border-radius: 11px; overflow: auto; }
    .source-head, .source-row { min-width: 1050px; display: grid; grid-template-columns: minmax(220px,1.4fr) 95px 125px 90px 70px 75px 95px 85px; gap: 10px; align-items: center; padding: 0 14px; }
    .source-head { height: 38px; background: var(--surface-2); color: var(--muted); font-size: 9px; }
    .source-row { min-height: 61px; border-top: 1px solid var(--border); font-size: 10px; }
    .source-name { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .source-logo { width: 32px; height: 32px; border-radius: 8px; background: var(--surface-3); color: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 800; }
    .source-name strong, .source-name small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .source-name small { color: var(--muted); margin-top: 4px; }
    code.tag-code { padding: 4px 6px; border-radius: 5px; background: var(--surface-3); color: #57787f; font-size: 9px; }
    .chart-layout { display: grid; grid-template-columns: 1.4fr .6fr; gap: 12px; margin-bottom: 13px; }
    .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 11px; padding: 16px; }
    .bar-chart { height: 190px; display: flex; align-items: end; gap: 7px; border-bottom: 1px solid var(--border); padding-top: 20px; }
    .bar-chart i { flex: 1; background: var(--accent); opacity: .75; border-radius: 3px 3px 0 0; }
    .health-line { display: grid; grid-template-columns: 95px 1fr 35px; gap: 8px; align-items: center; margin: 17px 0; color: var(--muted); font-size: 10px; }
    .health-line div { height: 6px; background: var(--surface-3); border-radius: 3px; overflow: hidden; }
    .health-line i { height: 100%; display: block; background: var(--accent); }
    .job-head, .job-row { min-width: 900px; display: grid; grid-template-columns: 1.25fr 130px 90px 75px 70px 160px 35px; gap: 10px; align-items: center; padding: 0 14px; }

      <div class="admin-metrics"><div class="admin-metric"><strong>68</strong><span>已启用 Endpoint</span></div><div class="admin-metric"><strong>61</strong><span>健康运行</span></div><div class="admin-metric"><strong>4</strong><span>需要关注</span></div><div class="admin-metric"><strong>327</strong><span>今日新内容</span></div></div>
      <div class="admin-toolbar"><div class="tabs"><button class="tab active">全部</button><button class="tab">官方</button><button class="tab">媒体</button><button class="tab">论文</button><button class="tab">社区</button></div><div class="search"><input id="source-search" placeholder="搜索主体或 Endpoint..."/><button>${icons.search}</button></div></div>
      <div class="data-table"><div class="source-head"><span>信源</span><span>类型</span><span>Connector</span><span>周期</span><span>权威分</span><span>健康</span><span>今日内容</span><span>操作</span></div><div id="source-rows">${sourceRows(sources)}</div></div></div>`;
    document.getElementById('open-source-modal').onclick=()=>document.getElementById('source-modal').classList.add('open');
    const ss=document.getElementById('source-search'); ss.oninput=()=>document.getElementById('source-rows').innerHTML=sourceRows(sources.filter(s=>(s.name+s.entity).toLowerCase().includes(ss.value.toLowerCase())));
    bindSourceRows();
  }
  function sourceRows(list){return list.map((s,i)=>`<div class="source-row"><div class="source-name"><span class="source-logo">${s.entity.slice(0,2)}</span><div><strong>${s.name}</strong><small>${s.entity} · ${s.country} · ${s.last}</small></div></div><span>${s.type}</span><code class="tag-code">${s.connector}</code><span>${s.interval}</span><strong>${s.authority}</strong><span class="status ${s.status==='warning'?'warning':s.status==='error'?'error':s.status==='manual'?'manual':''}">${s.status==='healthy'?'正常':s.status==='warning'?'警告':s.status==='error'?'失败':'人工'}</span><span>${s.items} 条</span><button class="btn small" data-source-index="${i}">管理</button></div>`).join('');}
  function bindSourceRows(){document.querySelectorAll('[data-source-index]').forEach(b=>b.onclick=()=>toast('已打开信源配置抽屉（原型演示）'));}

  function renderAdminCrawls(){
    const jobs=[['OpenAI News','WEB_LIST','成功','18 条','2.4s','2026-07-16 17:02:12'],['机器之心','WEB_LIST','解析警告','31 条','6.8s','2026-07-16 16:41:03'],['DeepSeek GitHub Releases','GITHUB_RELEASE','失败','0 条','1.3s','2026-07-16 14:09:48'],['Hacker News AI','API','成功','19 条','830ms','2026-07-16 17:01:24'],['arXiv cs.AI','RSS','成功','42 条','1.9s','2026-07-16 16:21:08']];
    document.getElementById('page-admin-crawls').innerHTML=`<div class="page-shell">${header('采集监控','观察成功率、结构变化、任务耗时、积压与重试情况。',`<button class="btn">${icons.refresh} 刷新</button><button class="btn primary">运行健康检查</button>`)}
      <div class="chart-layout"><div class="chart-card"><div class="panel-heading"><h3>24 小时采集量</h3><span class="muted">共 2,841 条原始文档</span></div><div class="bar-chart">${[42,35,51,64,48,72,69,81,76,88,70,63,91,84,75,98,82,77,100,93,86,74,68,79].map(v=>`<i style="height:${v}%"></i>`).join('')}</div></div><div class="chart-card"><div class="panel-heading"><h3>Connector 健康度</h3></div>${[['RSS / Atom',99],['Website / Sitemap',92],['GitHub',97],['Hugging Face',98],['arXiv / OpenReview',96]].map(h=>`<div class="health-line"><span>${h[0]}</span><div><i style="width:${h[1]}%"></i></div><strong>${h[1]}%</strong></div>`).join('')}</div></div>
      <div class="data-table"><div class="job-head"><span>信源</span><span>Connector</span><span>状态</span><span>结果</span><span>耗时</span><span>执行时间</span><span></span></div>${jobs.map((j,i)=>`<div class="job-row"><strong>${j[0]}</strong><code class="tag-code">${j[1]}</code><span class="status ${i===1?'warning':i===2?'error':''}">${j[2]}</span><span>${j[3]}</span><span>${j[4]}</span><span>${j[5]}</span><button class="btn icon small" data-retry="${i}">↻</button></div>`).join('')}</div></div>`;
    document.querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>toast('重试任务已进入队列'));
  }

  const reviewItems=[
    {title:'Coding Agent 文件权限异常仍待厂商确认',source:'TechCrunch AI',issue:'可信媒体的未证实报道，需要保持 UNCONFIRMED、排除精选并等待官方证据。',members:['TechCrunch AI 报道','公开 GitHub Issue','厂商后续公告（待补充）']},
    {title:'百度文库、网盘升级 GenFlow',source:'IT之家',issue:'疑似转载链，需要选择一手主条目并降低重复报道权重。',members:['IT之家报道','百度官方站点公告','新浪科技报道']},
    {title:'新论文提出长程工具调用记忆压缩方法',source:'Hugging Face Papers',issue:'分类模型在“论文研究”和“Agent 工程”之间置信度较低。',members:['Hugging Face Daily Papers','arXiv 原文']}
  ];
  function renderAdminContent(){
    const detail=reviewItems[selectedReview];
    document.getElementById('page-admin-content').innerHTML=`<div class="page-shell">${header('内容审核','处理低置信度分类、精选候选、事件聚类冲突与版权策略异常。',`<button class="btn">审核规则</button><button class="btn primary">批量通过高置信度</button>`)}
      <div class="review-layout"><div class="review-list">${reviewItems.map((r,i)=>`<button class="review-item ${i===selectedReview?'active':''}" data-review="${i}"><span class="muted">${r.source}</span><h3>${r.title}</h3><p>${r.issue}</p></button>`).join('')}</div>
      <div class="review-detail"><div class="badge">事件聚类复核</div><h2>${detail.title}</h2><p class="muted">${detail.issue}</p><div style="margin-top:15px"><strong style="font-size:11px">候选成员</strong>${detail.members.map((m,i)=>`<label class="cluster-card"><input type="checkbox" ${i<2?'checked':''}/><div><strong>${m}</strong><p>相似度 ${(0.93-i*.08).toFixed(2)} · ${i===0?'建议主条目':'关联报道'}</p></div></label>`).join('')}</div><div class="modal-actions"><button class="btn danger">拆分事件</button><button class="btn">保存草稿</button><button class="btn primary" id="approve-review">确认聚类</button></div></div></div></div>`;
    document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{selectedReview=Number(b.dataset.review);renderAdminContent();});
    document.getElementById('approve-review').onclick=()=>toast('审核结果已保存并生成纠错样本');
  }

  function renderAdminModels(){
    document.getElementById('page-admin-models').innerHTML=`<div class="page-shell">${header('模型与 Prompt','为摘要、翻译、分类、聚类、RAG 和 Agent 设置模型路由、版本与评测。',`<button class="btn">运行评测集</button><button class="btn primary">发布新版本</button>`)}
      <div class="model-layout"><div class="model-list"><div class="panel-heading"><h3>任务模型路由</h3><span class="muted">Provider 抽象 / Mock 可用</span></div>${[['内容摘要','DeepSeek API','GenerationProvider'],['事件聚类判断','DeepSeek API','GenerationProvider'],['Embedding','BAAI/bge-m3','EmbeddingProvider'],['Rerank','BAAI/bge-reranker-v2-m3','RerankProvider'],['RAG 回答','DeepSeek API','流式输出'],['开发测试','Mock Provider','无需 API Key']].map((m,i)=>`<div class="model-row"><div><strong>${m[0]}</strong><small>${m[2]}</small></div><code class="tag-code">${m[1]}</code><span class="status ${i===5?'warning':''}">${i===5?'开发可用':'已启用'}</span></div>`).join('')}</div>
      <div class="prompt-card"><div class="panel-heading"><h3>Prompt 编辑器</h3><span class="badge">v12</span></div><label>任务</label><select><option>内容摘要</option><option>事件聚类</option><option>RAG 回答</option></select><label>系统 Prompt</label><textarea>你是 AI 情报编辑。请基于输入原文生成准确、信息密度高的中文摘要。不得补充原文未支持的结论；区分事实、推断与观点；输出 JSON。</textarea><label>变更说明</label><input value="加强事实与推断区分，统一产品名称"/><div class="admin-metrics" style="grid-template-columns:repeat(3,1fr);margin-top:13px"><div class="admin-metric"><strong>94.2%</strong><span>结构有效率</span></div><div class="admin-metric"><strong>91.8%</strong><span>事实一致性</span></div><div class="admin-metric"><strong>¥18.4</strong><span>今日成本</span></div></div><button class="btn primary" style="width:100%">保存为新版本</button></div></div></div>`;
  }

  function openEvent(id){
    const event={
      title:id===2?'Coding Agent 文件系统权限边界受到关注':'Agent 产品开始从 Demo 进入可交付工作流阶段',
      summary:id===2?'多家可信媒体与开发者社区正在追踪文件权限异常。当前仍存在未证实部分，事件时间线严格区分报道、公开问题单和后续官方证据。':'近期产品更新显示，Agent 正从单轮演示转向可恢复、可审批、可审计并能交付报告或工程结果的完整工作流。',
      fact:id===2?'UNCONFIRMED':'CONFIRMED',sources:id===2?4:5
    };
    activeRoute='event'; document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.getElementById('page-event').classList.add('active'); document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
    document.getElementById('page-event').innerHTML=`<article class="detail-page"><button class="back" id="event-back">← 返回精选</button><div class="detail-meta"><span class="badge">热点事件</span><span class="status ${event.fact==='UNCONFIRMED'?'warning':''}">${event.fact==='UNCONFIRMED'?'未证实':'已证实'}</span><span>${event.sources} 个独立信源</span></div><h1>${event.title}</h1><div class="info-box"><label>事件摘要</label><p>${event.summary}</p></div><div class="article-body"><h2>来源时间线</h2><p><strong>11:30 · 一手/研究：</strong>${articles[0].title}</p><p><strong>10:10 · 官方：</strong>${articles[1].title}</p><p><strong>09:40 · 官方：</strong>${articles[2].title}</p><h2>跨事件关联</h2><p>关联“Agent 审批与恢复能力演进”事件，关系为 SAME_SERIES；该关联不会自动合并两个事件。</p><h2>研究入口</h2><p>可基于当前事件的有权内容创建订阅或发起带引用研究。检索前会按当前用户的数据权限过滤。</p></div><div class="header-actions"><button class="btn" data-route="subscriptions">订阅此事件</button><button class="btn primary" data-route="knowledge">基于事件提问</button></div></article>`;
    document.getElementById('event-back').onclick=()=>routeTo('featured'); document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>routeTo(b.dataset.route)); window.scrollTo(0,0);
  }

  function openDetail(id){ const a=articles.find(x=>x.id===id); if(!a)return; activeRoute='detail'; document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.getElementById('page-detail').classList.add('active'); document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active')); document.getElementById('page-detail').innerHTML=`<article class="detail-page"><button class="back" id="detail-back">← 返回</button><div class="detail-meta"><strong>${a.source}</strong><span>· ${a.sourceType}</span>${a.featured?'<span class="badge">精选</span>':''}${a.official?'<span class="badge">官方/一手</span>':''}${a.factStatus==='UNCONFIRMED'?'<span class="status warning">未证实</span>':''}<span class="score">● ${a.score}</span><button class="bookmark ${favorites.has(a.id)?'active':''}" data-favorite="${a.id}">${icons.bookmark}</button><button class="btn small">${icons.download} 导出 Markdown</button></div><h1>${a.title}</h1><p class="muted">${a.published} · ${a.original}</p>${a.featured?`<div class="info-box"><label>精选理由</label><p>${a.reason}</p></div>`:''}<div class="info-box"><label>AI 摘要</label><p>${a.summary}</p></div><div class="article-body"><span class="muted">原文 / 策略允许的清洗正文</span><p>${a.body}</p><h2>事件与知识关系</h2><p>系统会将本条内容与相同事实事件的官方公告、GitHub Release、媒体报道和社区观点聚合，并优先以一手来源作为事件主条目；一篇内容也可关联多个事件。</p></div><div class="detail-tags">${a.tags.map(t=>`<span># ${t}</span>`).join('')}</div><button class="btn">阅读原文 ${icons.external} <span class="mono">${a.original}</span></button></article>`; document.getElementById('detail-back').onclick=()=>routeTo(location.hash.replace('#/','')||'featured'); bindArticleEvents(); window.scrollTo(0,0); }

  function renderRoute(route){
    ({featured:renderFeatured,all:renderAll,reports:renderReports,topics:renderTopics,favorites:renderFavorites,subscriptions:renderSubscriptions,knowledge:renderKnowledge,agent:renderAgent,'admin-sources':renderAdminSources,'admin-crawls':renderAdminCrawls,'admin-content':renderAdminContent,'admin-models':renderAdminModels}[route]||renderFeatured)();
  }
  function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}

  document.addEventListener('click',e=>{
    const route=e.target.closest('[data-route]'); if(route){routeTo(route.dataset.route);}
    const close=e.target.closest('[data-close-modal]'); if(close)document.getElementById('source-modal').classList.remove('open');
  });
  document.querySelectorAll('[data-theme-set]').forEach(b=>b.onclick=()=>{ const t=b.dataset.themeSet; document.documentElement.dataset.theme=t; localStorage.setItem('ai-hotspot-theme',t); document.querySelectorAll('[data-theme-set]').forEach(x=>x.classList.toggle('active',x.dataset.themeSet===t)); });
  const storedTheme=localStorage.getItem('ai-hotspot-theme')||'light'; document.documentElement.dataset.theme=storedTheme; document.querySelectorAll('[data-theme-set]').forEach(x=>x.classList.toggle('active',x.dataset.themeSet===storedTheme));
  document.getElementById('source-modal').onclick=e=>{if(e.target.id==='source-modal')e.currentTarget.classList.remove('open');};
  document.getElementById('probe-source').onclick=()=>{document.getElementById('probe-result').classList.add('show');toast('Agent 试抓取完成');};
  document.getElementById('confirm-source').onclick=()=>{document.getElementById('source-modal').classList.remove('open');toast('信源已启用（原型演示）');};
  window.addEventListener('hashchange',()=>{const r=location.hash.replace('#/','')||'featured';if(r!==activeRoute)routeTo(r);});
  routeTo(activeRoute);
</script>
</body>
</html>
