components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: AIHOTSPOT_SESSION
      description: Redis 中保存的服务端不透明会话。
  parameters:
    CsrfHeader:
      name: X-XSRF-TOKEN
      in: header
      required: true
      schema: { type: string }
    UuidPathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: 未登录或会话已失效
      content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
    Forbidden:
      description: 当前用户缺少角色或权限
      content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
    Conflict:
      description: 唯一性或乐观锁冲突
      content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
    NotFound:
      description: 资源不存在
      content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
    Unprocessable:
      description: 领域规则、URL 安全策略或试抓取前置条件未满足
      content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
    RateLimited:
      description: 登录或邀请尝试超过限额
      content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
  schemas:
    GenericObject:
      type: object
      additionalProperties: true
    GenericList:
      type: array
      items: { $ref: "#/components/schemas/GenericObject" }
    IdResponse:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
    FeedbackRequest:
      type: object
      required: [type, reason]
      properties:
        contentId: { type: [string, "null"], format: uuid }
        eventId: { type: [string, "null"], format: uuid }
        type: { type: string }
        reason: { type: string, minLength: 8, maxLength: 2000 }
        contactEmail: { type: [string, "null"], format: email, maxLength: 320 }
    FavoriteRequest:
      type: object
      required: [targetType, targetId]
      properties:
        targetType: { type: string }
        targetId: { type: string, format: uuid }
    SubscriptionRequest:
      type: object
      required: [name, frequency, timezone, sendTime]
      properties:
        name: { type: string }
        frequency: { type: string, enum: [DAILY, WEEKLY] }
        timezone: { type: string, example: Asia/Shanghai }
        sendTime: { type: string, format: time }
        weekday: { type: [integer, "null"], minimum: 1, maximum: 7 }
        topicSlugs: { type: array, items: { type: string } }
        maxItems: { type: [integer, "null"], minimum: 1 }
    ResearchQueryRequest:
      type: object
      required: [question]
      properties:
        sessionId: { type: [string, "null"], format: uuid }
        question: { type: string, minLength: 1 }
        filters: { type: object, additionalProperties: true }
    ResearchFeedbackRequest:
      type: object
      required: [rating]
      properties:
        rating: { type: string, enum: [HELPFUL, UNHELPFUL] }
        issueCategories:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [IRRELEVANT, MISSING_EVIDENCE, OUTDATED, INCORRECT, INCOMPLETE, CITATION_MISMATCH, TOO_VERBOSE, OTHER]
        comment: { type: [string, "null"], maxLength: 1000 }
    ResearchFeedbackTriageRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [TRIAGED, EVAL_CANDIDATE, RESOLVED, DISMISSED] }
    AgentStartRequest:
      type: object
      required: [agentCode, objective]
      properties:
        agentCode: { type: string, minLength: 1 }
        objective: { type: string, minLength: 1 }
    AgentDecisionRequest:
      type: object
      required: [approve]
      properties:
        approve: { type: boolean }
        note: { type: [string, "null"] }
    GovernanceActionRequest:
      type: object
      required: [action, reason, version]
      properties:
        action: { type: string }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        version: { type: integer, minimum: 0 }
    EventRelationRequest:
      type: object
      required: [contentId, relationType, confidence]
      properties:
        contentId: { type: string, format: uuid }
        relationType: { type: string }
        confidence: { type: number, minimum: 0, maximum: 100 }
    TicketResolutionRequest:
      type: object
      required: [status, resolution]
      properties:
        status: { type: string }
        resolution: { type: string, minLength: 1, maxLength: 2000 }
