openapi: 3.1.0
info:
  title: AI Hotspot Core API
  version: 1.0.0
  description: AI Hotspot Core API 现行契约，覆盖公开产品、用户工作台、管理治理与运维接口。
servers:
  - url: /api/core
tags:
  - { name: Auth, description: 邮箱验证码注册/登录、管理员密码登录与会话认证 }
  - { name: IdentityAdmin, description: 管理员账号与邀请码 }
  - { name: SourceAdmin, description: ADMIN/OPERATOR 信源管理 }
  - { name: AuditAdmin, description: 管理审计 }
  - { name: CrawlAdmin, description: 公开 Connector 采集任务、调度与死信回放 }
  - { name: PublicContent, description: 游客可访问的已发布公开内容 }
  - { name: PublicDiscovery, description: 公开搜索、主题、事件和反馈 }
  - { name: Favorites, description: 登录用户收藏 }
  - { name: Subscriptions, description: 登录用户订阅和管理员投递治理 }
  - { name: Research, description: 登录用户 RAG 研究 }
  - { name: Agents, description: 登录用户 Agent 运行与审批 }
  - { name: ContentAdmin, description: 内容、事件和治理工单 }
  - { name: ReportAdmin, description: 报告生成、编辑与发布 }
  - { name: AiAdmin, description: Provider、索引、评测和 RAG 监控 }
  - { name: Operations, description: 发布就绪和运行门禁 }
  - { name: System, description: 健康检查与本地联调 }
paths:
  /api/v1/health:
    get:
      tags: [System]
      operationId: getCoreHealth
      responses:
        "200":
          description: Core API 正常
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /api/v1/auth/csrf:
    get:
      tags: [Auth]
      operationId: getCsrfToken
      security: []
      responses:
        "200":
          description: 返回双提交 CSRF Token，并设置 XSRF-TOKEN Cookie。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CsrfToken" }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: 登录成功并设置 HttpOnly Session Cookie。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/email-codes:
    post:
      tags: [Auth]
      operationId: requestEmailCode
      security: []
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailCodeRequest" }
      responses:
        "200": { description: 为避免账号枚举，无论邮箱状态均返回统一接受响应。 }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: registerWithEmailCode
      security: []
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicRegisterRequest" }
      responses:
        "200":
          description: 注册普通用户并建立 Session。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/auth/code-login:
    post:
      tags: [Auth]
      operationId: loginWithEmailCode
      security: []
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeLoginRequest" }
      responses:
        "200":
          description: 邮箱验证码登录成功并建立 Session。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      responses:
        "200": { description: 会话已注销 }
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: 当前登录用户
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/invitations/{token}/register:
    post:
      tags: [Auth]
      operationId: registerByInvitation
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/CsrfHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "200":
          description: 注册成功；邀请码仅可在约束范围内消费。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/admin/users:
    get:
      tags: [IdentityAdmin]
      operationId: listUsers
      security: [{ sessionCookie: [] }]
      parameters: [{ name: limit, in: query, schema: { type: integer, default: 50 } }]
      responses:
        "200":
          description: 用户列表
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [IdentityAdmin]
      operationId: createUser
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "200": { description: 账号已创建 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/admin/invitations:
    get:
      tags: [IdentityAdmin]
      operationId: listInvitations
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: 邀请列表，不返回历史明文 Token。
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Invitation" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [IdentityAdmin]
      operationId: createInvitation
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvitationRequest" }
      responses:
        "200":
          description: 邀请已创建；明文 Token 只在本响应返回一次。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationCreated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/sources:
    get:
      tags: [SourceAdmin]
      operationId: listSources
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: factStatus, in: query, schema: { type: string } }
        - { name: query, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: 信源指标和入口列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceListResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [SourceAdmin]
      operationId: createSource
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSourceRequest" }
      responses:
        "200":
          description: 创建 DRAFT 主体和入口并执行 SSRF 安全校验；X 只能表达 RESERVED 草稿，禁止探测、启用和采集；不支持微信公众号。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedSource" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/admin/sources/connector-schemas:
    get:
      tags: [SourceAdmin]
      operationId: getConnectorSchemas
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: MVP Connector 类型及允许配置键 }
  /api/v1/admin/sources/{id}:
    get:
      tags: [SourceAdmin]
      operationId: getSource
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: 信源主体与入口详情 }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/sources/endpoints/{id}/probe:
    post:
      tags: [SourceAdmin]
      operationId: probeSourceEndpoint
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CsrfHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersionRequest" }
      responses:
        "200":
          description: 安全试抓取结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeResult" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/admin/sources/endpoints/{id}/activate:
    post:
      tags: [SourceAdmin]
      operationId: activateSourceEndpoint
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CsrfHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersionRequest" }
      responses:
        "200": { description: 试抓取通过后启用 }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/admin/sources/endpoints/{id}/pause:
    post:
      tags: [SourceAdmin]
      operationId: pauseSourceEndpoint
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CsrfHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersionRequest" }
      responses:
        "200": { description: 入口已暂停 }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/admin/audits:
    get:
      tags: [AuditAdmin]
      operationId: listAudits
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: targetType, in: query, required: true, schema: { type: string } }
        - { name: targetId, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        "200": { description: 按目标检索不可变审计记录 }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/fetch-jobs:
    get:
      tags: [CrawlAdmin]
      operationId: listFetchJobs
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [QUEUED, RUNNING, WAITING_RETRY, SUCCEEDED, FAILED, DEAD_LETTERED, CANCELLED] } }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: 采集任务列表
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FetchJob" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/fetch-jobs/{id}:
    get:
      tags: [CrawlAdmin]
      operationId: getFetchJob
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: 采集任务详情, content: { application/json: { schema: { $ref: "#/components/schemas/FetchJob" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/fetch-jobs/dispatch-due:
    post:
      tags: [CrawlAdmin]
      operationId: dispatchDueFetchJobs
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        "202": { description: 到期 Endpoint 已按行锁批量派发 }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/fetch-jobs/endpoints/{endpointId}:
    post:
      tags: [CrawlAdmin]
      operationId: triggerEndpointFetch
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: endpointId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "202": { description: 手工采集任务已进入 Outbox, content: { application/json: { schema: { $ref: "#/components/schemas/FetchJob" } } } }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/admin/dead-letters:
    get:
      tags: [CrawlAdmin]
      operationId: listDeadLetters
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, REPLAYED, IGNORED] } }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: 死信列表, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DeadLetter" } } } } }
  /api/v1/admin/dead-letters/{id}/replay:
    post:
      tags: [CrawlAdmin]
      operationId: replayDeadLetter
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "202": { description: 采集或内容处理死信已审计并重新进入 Outbox, content: { application/json: { schema: { $ref: "#/components/schemas/DeadLetterReplayResponse" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/public/contents:
    get:
      tags: [PublicContent]
      operationId: listPublicContents
      security: []
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 50 } }
      responses:
        "200": { description: 仅返回 PUBLISHED + PUBLIC + 通过准入的内容, content: { application/json: { schema: { $ref: "#/components/schemas/PublicContentPage" } } } }
  /api/v1/public/contents/featured:
    get:
      tags: [PublicContent]
      operationId: listFeaturedContents
      security: []
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 50 } }
      responses:
        "200": { description: 精选公开内容, content: { application/json: { schema: { $ref: "#/components/schemas/PublicContentPage" } } } }
  /api/v1/public/contents/{id}:
    get:
      tags: [PublicContent]
      operationId: getPublicContent
      security: []
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: 公开内容详情, content: { application/json: { schema: { $ref: "#/components/schemas/PublicContent" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/public/reports:
    get:
      tags: [PublicContent]
      operationId: getPublicReport
      description: 按上海时区从已准入公开内容实时聚合日报、周报或月报。
      security: []
      parameters:
        - { name: period, in: query, schema: { type: string, enum: [DAILY, WEEKLY, MONTHLY], default: DAILY } }
        - { name: anchor, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: 实时报告及归档, content: { application/json: { schema: { $ref: "#/components/schemas/PublicReportResponse" } } } }
        "422": { description: 不支持的报告周期 }
  /api/v1/public/search:
    get:
      tags: [PublicDiscovery]
      operationId: searchPublicContent
      security: []
      parameters:
        - { name: query, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: sourceType, in: query, schema: { type: string } }
        - { name: contentType, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 30, minimum: 1 } }
      responses:
        "200": { description: 符合公开准入规则的搜索结果, content: { application/json: { schema: { $ref: "#/components/schemas/GenericList" } } } }
  /api/v1/public/topics:
    get:
      tags: [PublicDiscovery]
      operationId: listPublicTopics
      security: []
      responses:
        "200": { description: 公开主题列表, content: { application/json: { schema: { $ref: "#/components/schemas/GenericList" } } } }
  /api/v1/public/topics/{slug}:
    get:
      tags: [PublicDiscovery]
      operationId: getPublicTopic
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 30, minimum: 1 } }
      responses:
        "200": { description: 主题详情及公开内容, content: { application/json: { schema: { $ref: "#/components/schemas/GenericObject" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/public/events:
    get:
      tags: [PublicDiscovery]
      operationId: listPublicEvents
      security: []
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 10, minimum: 1 } }
      responses:
        "200": { description: 公开事件列表, content: { application/json: { schema: { $ref: "#/components/schemas/GenericList" } } } }
  /api/v1/public/events/{id}:
    get:
      tags: [PublicDiscovery]
      operationId: getPublicEvent
      security: []
      parameters: [{ $ref: "#/components/parameters/UuidPathId" }]
      responses:
        "200": { description: 事件详情及关联公开内容, content: { application/json: { schema: { $ref: "#/components/schemas/GenericObject" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/public/feedback:
    post:
      tags: [PublicDiscovery]
      operationId: submitPublicFeedback
      security: []
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackRequest" }
      responses:
        "200": { description: 治理工单已创建, content: { application/json: { schema: { $ref: "#/components/schemas/GenericObject" } } } }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/public/unsubscribe/{token}:
    get:
      tags: [Subscriptions]
      operationId: unsubscribeByToken
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 一键退订结果页面
          content:
            text/html:
              schema: { type: string }
  /api/v1/favorites:
    get:
      tags: [Favorites]
      operationId: listFavorites
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: 当前用户收藏, content: { application/json: { schema: { $ref: "#/components/schemas/GenericList" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Favorites]
      operationId: addFavorite
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FavoriteRequest" }
      responses:
        "204": { description: 已收藏 }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/favorites/{type}/{id}:
    get:
      tags: [Favorites]
      operationId: getFavoriteState
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: type, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: 收藏状态, content: { application/json: { schema: { type: object, required: [favorite], properties: { favorite: { type: boolean } } } } } }
    delete:
      tags: [Favorites]
      operationId: removeFavorite
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: type, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "204": { description: 已取消收藏 }
  /api/v1/subscriptions:
    get:
      tags: [Subscriptions]
      operationId: listSubscriptions
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: 当前用户订阅, content: { application/json: { schema: { $ref: "#/components/schemas/GenericList" } } } }
    post:
      tags: [Subscriptions]
      operationId: createSubscription
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionRequest" }
      responses:
        "200": { description: 订阅已创建, content: { application/json: { schema: { $ref: "#/components/schemas/IdResponse" } } } }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/subscriptions/{id}/status:
    put:
      tags: [Subscriptions]
      operationId: setSubscriptionStatus
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/UuidPathId" }
        - { $ref: "#/components/parameters/CsrfHeader" }
