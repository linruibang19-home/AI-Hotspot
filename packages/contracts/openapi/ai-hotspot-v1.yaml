openapi: 3.1.0
info:
  title: AI Hotspot Core API
  version: 0.4.1
  description: M4 身份、正式信源目录、公开 Connector、死信回放、公开内容与实时报告接口契约。
servers:
  - url: /api/core
tags:
  - { name: Auth, description: 会话认证与邀请注册 }
  - { name: IdentityAdmin, description: 管理员账号与邀请码 }
  - { name: SourceAdmin, description: ADMIN/OPERATOR 信源管理 }
  - { name: AuditAdmin, description: 管理审计 }
  - { name: CrawlAdmin, description: 公开 Connector 采集任务、调度与死信回放 }
  - { name: PublicContent, description: 游客可访问的已发布公开内容 }
  - { name: System, description: 健康检查与本地联调 }
paths:
  /api/v1/health:
    get:
      tags: [System]
      operationId: getCoreHealth
      responses:
        "200":
          description: Core API 正常
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /api/v1/auth/csrf:
    get:
      tags: [Auth]
      operationId: getCsrfToken
      security: []
      responses:
        "200":
          description: 返回双提交 CSRF Token，并设置 XSRF-TOKEN Cookie。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CsrfToken" }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: 登录成功并设置 HttpOnly Session Cookie。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      responses:
        "200": { description: 会话已注销 }
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: 当前登录用户
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/invitations/{token}/register:
    post:
      tags: [Auth]
      operationId: registerByInvitation
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/CsrfHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "200":
          description: 注册成功；邀请码仅可在约束范围内消费。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/admin/users:
    get:
      tags: [IdentityAdmin]
      operationId: listUsers
      security: [{ sessionCookie: [] }]
      parameters: [{ name: limit, in: query, schema: { type: integer, default: 50 } }]
      responses:
        "200":
          description: 用户列表
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [IdentityAdmin]
      operationId: createUser
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "200": { description: 账号已创建 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/admin/invitations:
    get:
      tags: [IdentityAdmin]
      operationId: listInvitations
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: 邀请列表，不返回历史明文 Token。
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Invitation" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [IdentityAdmin]
      operationId: createInvitation
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvitationRequest" }
      responses:
        "200":
          description: 邀请已创建；明文 Token 只在本响应返回一次。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationCreated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/sources:
    get:
      tags: [SourceAdmin]
      operationId: listSources
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: query, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: 信源指标和入口列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceListResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [SourceAdmin]
      operationId: createSource
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSourceRequest" }
      responses:
        "200":
          description: 创建 DRAFT 主体和入口并执行 SSRF 安全校验；X 只能表达 RESERVED 草稿，禁止探测、启用和采集；不支持微信公众号。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedSource" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/admin/sources/connector-schemas:
    get:
      tags: [SourceAdmin]
      operationId: getConnectorSchemas
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: MVP Connector 类型及允许配置键 }
  /api/v1/admin/sources/{id}:
    get:
      tags: [SourceAdmin]
      operationId: getSource
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: 信源主体与入口详情 }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/sources/endpoints/{id}/probe:
    post:
      tags: [SourceAdmin]
      operationId: probeSourceEndpoint
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CsrfHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersionRequest" }
      responses:
        "200":
          description: 安全试抓取结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeResult" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/admin/sources/endpoints/{id}/activate:
    post:
      tags: [SourceAdmin]
      operationId: activateSourceEndpoint
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CsrfHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersionRequest" }
      responses:
        "200": { description: 试抓取通过后启用 }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/admin/sources/endpoints/{id}/pause:
    post:
      tags: [SourceAdmin]
      operationId: pauseSourceEndpoint
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CsrfHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersionRequest" }
      responses:
        "200": { description: 入口已暂停 }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/admin/audits:
    get:
      tags: [AuditAdmin]
      operationId: listAudits
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: targetType, in: query, required: true, schema: { type: string } }
        - { name: targetId, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        "200": { description: 按目标检索不可变审计记录 }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/fetch-jobs:
    get:
      tags: [CrawlAdmin]
      operationId: listFetchJobs
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [QUEUED, RUNNING, WAITING_RETRY, SUCCEEDED, FAILED, DEAD_LETTERED, CANCELLED] } }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: 采集任务列表
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FetchJob" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/fetch-jobs/{id}:
    get:
      tags: [CrawlAdmin]
      operationId: getFetchJob
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: 采集任务详情, content: { application/json: { schema: { $ref: "#/components/schemas/FetchJob" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/fetch-jobs/dispatch-due:
    post:
      tags: [CrawlAdmin]
      operationId: dispatchDueFetchJobs
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/CsrfHeader" }
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        "202": { description: 到期 Endpoint 已按行锁批量派发 }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/fetch-jobs/endpoints/{endpointId}:
    post:
      tags: [CrawlAdmin]
      operationId: triggerEndpointFetch
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: endpointId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "202": { description: 手工采集任务已进入 Outbox, content: { application/json: { schema: { $ref: "#/components/schemas/FetchJob" } } } }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/v1/admin/dead-letters:
    get:
      tags: [CrawlAdmin]
      operationId: listDeadLetters
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, REPLAYED, IGNORED] } }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: 死信列表, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DeadLetter" } } } } }
  /api/v1/admin/dead-letters/{id}/replay:
    post:
      tags: [CrawlAdmin]
      operationId: replayDeadLetter
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CsrfHeader" }
      responses:
        "202": { description: 死信已审计并重新进入 Outbox, content: { application/json: { schema: { $ref: "#/components/schemas/FetchJob" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/public/contents:
    get:
      tags: [PublicContent]
      operationId: listPublicContents
      security: []
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 50 } }
      responses:
        "200": { description: 仅返回 PUBLISHED + PUBLIC + 通过准入的内容, content: { application/json: { schema: { $ref: "#/components/schemas/PublicContentPage" } } } }
  /api/v1/public/contents/featured:
    get:
      tags: [PublicContent]
      operationId: listFeaturedContents
      security: []
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 50 } }
      responses:
        "200": { description: 精选公开内容, content: { application/json: { schema: { $ref: "#/components/schemas/PublicContentPage" } } } }
  /api/v1/public/contents/{id}:
    get:
      tags: [PublicContent]
      operationId: getPublicContent
      security: []
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: 公开内容详情, content: { application/json: { schema: { $ref: "#/components/schemas/PublicContent" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/public/reports:
    get:
      tags: [PublicContent]
      operationId: getPublicReport
      description: 按上海时区从已准入公开内容实时聚合日报、周报或月报。
      security: []
      parameters:
        - { name: period, in: query, schema: { type: string, enum: [DAILY, WEEKLY, MONTHLY], default: DAILY } }
        - { name: anchor, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: 实时报告及归档, content: { application/json: { schema: { $ref: "#/components/schemas/PublicReportResponse" } } } }
        "422": { description: 不支持的报告周期 }
  /api/v1/system/smoke/outbox:
    post:
      tags: [System]
      operationId: createOutboxSmokeEvent
      description: 仅在本地 Smoke 开关启用时可用。
      responses:
        "202": { description: 测试事件已进入 Outbox }
  /api/v1/system/smoke/mail:
    post:
      tags: [System]
      operationId: sendSmokeMail
      description: 仅在本地 Smoke 开关启用时可用。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient, subject]
              properties:
                recipient: { type: string, format: email }
                subject: { type: string, minLength: 1 }
      responses:
        "202": { description: 测试邮件已交给 MailProvider }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: AIHOTSPOT_SESSION
      description: Redis 中保存的服务端不透明会话。
  parameters:
    CsrfHeader:
      name: X-XSRF-TOKEN
      in: header
      required: true
      schema: { type: string }
  responses:
    Unauthorized:
      description: 未登录或会话已失效
      content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
    Forbidden:
      description: 当前用户缺少角色或权限
      content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
    Conflict:
      description: 唯一性或乐观锁冲突
      content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
    NotFound:
      description: 资源不存在
      content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
    Unprocessable:
      description: 领域规则、URL 安全策略或试抓取前置条件未满足
      content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
    RateLimited:
      description: 登录或邀请尝试超过限额
      content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
  schemas:
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }
        correlationId: { type: string }
    Health:
      type: object
      required: [status, service, version, environment, correlationId]
      properties:
        status: { type: string, const: UP }
        service: { type: string, const: core-api }
        version: { type: string }
        environment: { type: string }
        correlationId: { type: string }
    CsrfToken:
      type: object
      required: [headerName, parameterName, token]
      properties:
        headerName: { type: string, const: X-XSRF-TOKEN }
        parameterName: { type: string }
        token: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, writeOnly: true }
    RegisterRequest:
      type: object
      required: [email, displayName, password]
      properties:
        email: { type: string, format: email }
        displayName: { type: string, minLength: 2, maxLength: 80 }
        password: { type: string, minLength: 12, maxLength: 72, writeOnly: true }
    CurrentUser:
      type: object
      required: [id, email, displayName, roles, permissions]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        roles: { type: array, items: { type: string, enum: [USER, EDITOR, OPERATOR, ADMIN] } }
        permissions: { type: array, items: { type: string } }
    CreateUserRequest:
      allOf:
        - { $ref: "#/components/schemas/RegisterRequest" }
        - type: object
          required: [role]
          properties:
            role: { type: string, enum: [USER, EDITOR, OPERATOR, ADMIN] }
    AdminUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        status: { type: string }
        roles: { type: string }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: [string, "null"], format: date-time }
    CreateInvitationRequest:
      type: object
      required: [defaultRole, maxUses, expiresAt]
      properties:
        defaultRole: { type: string, enum: [USER, EDITOR, OPERATOR, ADMIN] }
        maxUses: { type: integer, minimum: 1, maximum: 100 }
        expiresAt: { type: string, format: date-time }
    Invitation:
      type: object
      properties:
        id: { type: string, format: uuid }
        defaultRole: { type: string }
        maxUses: { type: integer }
        usedCount: { type: integer }
        expiresAt: { type: string, format: date-time }
        status: { type: string }
        createdAt: { type: string, format: date-time }
    InvitationCreated:
      allOf:
        - { $ref: "#/components/schemas/Invitation" }
        - type: object
          required: [token]
          properties:
            token: { type: string, description: 仅返回一次的邀请明文 }
    CreateSourceRequest:
      type: object
      required: [name, slug, entityType, officialLevel, authorityScore, endpointName, endpointUrl, endpointType, pollingIntervalSeconds, displayPolicy, indexPolicy]
      properties:
        name: { type: string, maxLength: 120 }
        slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        entityType: { type: string, enum: [COMPANY, RESEARCH, MEDIA, COMMUNITY, PROJECT, OTHER] }
        countryCode: { type: string, maxLength: 2 }
        officialLevel: { type: string, enum: [OFFICIAL, FIRST_PARTY, THIRD_PARTY] }
        authorityScore: { type: number, minimum: 0, maximum: 100 }
        websiteUrl: { type: string, format: uri }
        logoUrl: { type: string, format: uri }
        endpointName: { type: string, maxLength: 120 }
        endpointUrl: { type: string, format: uri }
        endpointType: { type: string, enum: [RSS, ATOM, WEBSITE, SITEMAP, GITHUB, HUGGING_FACE, ARXIV, OPENREVIEW, HACKER_NEWS, PUBLIC_MEDIA, PUBLIC_COMMUNITY, X] }
        language: { type: string }
        pollingIntervalSeconds: { type: integer, minimum: 300, maximum: 2592000 }
        displayPolicy: { type: string, enum: [FULLTEXT_ALLOWED, SUMMARY_ONLY, LINK_ONLY, HIDDEN] }
        indexPolicy: { type: string, enum: [PUBLIC_RAG, PRIVATE_RAG, METADATA_ONLY, NO_INDEX] }
        authorityOverride: { type: number, minimum: 0, maximum: 100 }
        config: { type: object, additionalProperties: true }
    CreatedSource:
      type: object
      required: [sourceId, endpointId]
      properties:
        sourceId: { type: string, format: uuid }
        endpointId: { type: string, format: uuid }
    VersionRequest:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 0 }
    ProbeResult:
      type: object
      required: [endpointId, healthStatus, latencyMs, message, version]
      properties:
        endpointId: { type: string, format: uuid }
        healthStatus: { type: string, enum: [HEALTHY, WARNING, FAILED] }
        httpStatus: { type: [integer, "null"] }
        latencyMs: { type: integer }
        message: { type: string }
        version: { type: integer }
    SourceMetrics:
      type: object
      properties:
        totalEndpoints: { type: integer }
        activeEndpoints: { type: integer }
        healthyEndpoints: { type: integer }
        attentionEndpoints: { type: integer }
        productionEndpoints: { type: integer }
        testEndpoints: { type: integer }
    SourceSummary:
      type: object
      additionalProperties: true
      required: [id, name, slug, endpointId, endpointType, connectorType, endpointStatus, catalogKind, healthStatus, endpointVersion, todayContentCount]
    SourceListResponse:
      type: object
      required: [metrics, items]
      properties:
        metrics: { $ref: "#/components/schemas/SourceMetrics" }
        items: { type: array, items: { $ref: "#/components/schemas/SourceSummary" } }
    FetchJob:
      type: object
      required: [id, endpointId, triggerType, idempotencyKey, status, attemptCount, maxAttempts, correlationId, traceId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        endpointId: { type: string, format: uuid }
        endpointName: { type: string }
        sourceName: { type: string }
        triggerType: { type: string, enum: [SCHEDULED, MANUAL, REPLAY] }
        idempotencyKey: { type: string }
        status: { type: string, enum: [QUEUED, RUNNING, WAITING_RETRY, SUCCEEDED, FAILED, DEAD_LETTERED, CANCELLED] }
        attemptCount: { type: integer, minimum: 0 }
        maxAttempts: { type: integer, minimum: 1 }
        httpStatus: { type: [integer, "null"] }
        artifactCount: { type: integer, minimum: 0 }
        discoveredCount: { type: integer, minimum: 0 }
        newEntryCount: { type: integer, minimum: 0 }
