name: ai-hotspot

services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_hotspot}
      POSTGRES_USER: ${POSTGRES_USER:-ai_hotspot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_hotspot}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  redis:
    image: redis:8.4.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-ai_hotspot}"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ai_hotspot}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  rabbitmq:
    image: rabbitmq:4.3.2-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-ai_hotspot}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-ai_hotspot}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-ai_hotspot}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ai_hotspot}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ai_hotspot-local-password}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  mailpit:
    image: axllent/mailpit:v1.30.0
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  ai-api:
    build:
      context: ./services/ai
    environment:
      AI_HOTSPOT_ENV: ${AI_HOTSPOT_ENV:-development}
      AI_HOTSPOT_VERSION: ${AI_HOTSPOT_VERSION:-0.1.0}
      DATABASE_URL: ${AI_DATABASE_URL:-postgresql+psycopg://ai_hotspot:ai_hotspot@postgres:5432/ai_hotspot}
      REDIS_URL: redis://:${REDIS_PASSWORD:-ai_hotspot}@redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-ai_hotspot}:${RABBITMQ_DEFAULT_PASS:-ai_hotspot}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST:-ai_hotspot}
      MINIO_ENDPOINT: http://minio:9000
      GENERATION_PROVIDER: ${GENERATION_PROVIDER:-mock}
      GENERATION_BASE_URL: ${GENERATION_BASE_URL:-}
      GENERATION_MODEL: ${GENERATION_MODEL:-deepseek-chat}
      GENERATION_API_KEY: ${GENERATION_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      RERANK_PROVIDER: ${RERANK_PROVIDER:-mock}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  worker:
    build:
      context: ./services/ai
    command: ["ai-hotspot-worker"]
    environment:
      AI_HOTSPOT_ENV: ${AI_HOTSPOT_ENV:-development}
      DATABASE_URL: ${AI_DATABASE_URL:-postgresql+psycopg://ai_hotspot:ai_hotspot@postgres:5432/ai_hotspot}
      REDIS_URL: redis://:${REDIS_PASSWORD:-ai_hotspot}@redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-ai_hotspot}:${RABBITMQ_DEFAULT_PASS:-ai_hotspot}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST:-ai_hotspot}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-ai_hotspot}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-ai_hotspot-local-password}
      MINIO_BUCKET: ${MINIO_BUCKET:-fetch-artifacts}
      CRAWL_RETRY_DELAY_MS: ${CRAWL_RETRY_DELAY_MS:-2000}
      CONTENT_RETRY_DELAY_MS: ${CONTENT_RETRY_DELAY_MS:-2000}
      GENERATION_PROVIDER: ${GENERATION_PROVIDER:-mock}
      GENERATION_BASE_URL: ${GENERATION_BASE_URL:-}
      GENERATION_MODEL: ${GENERATION_MODEL:-deepseek-chat}
      GENERATION_API_KEY: ${GENERATION_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      RERANK_PROVIDER: ${RERANK_PROVIDER:-mock}
    depends_on:
      rabbitmq: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped
    networks: [backend]

  core-api:
    build:
      context: ./services/core
    environment:
      AI_HOTSPOT_ENV: ${AI_HOTSPOT_ENV:-development}
      AI_HOTSPOT_VERSION: ${AI_HOTSPOT_VERSION:-0.1.0}
      CORE_DATABASE_URL: ${CORE_DATABASE_URL:-jdbc:postgresql://postgres:5432/ai_hotspot}
      POSTGRES_USER: ${POSTGRES_USER:-ai_hotspot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_hotspot}
      REDIS_URL: redis://:${REDIS_PASSWORD:-ai_hotspot}@redis:6379/0
      RABBITMQ_ADDRESSES: rabbitmq:5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-ai_hotspot}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-ai_hotspot}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-ai_hotspot}
      AI_API_BASE_URL: http://ai-api:8000
      AI_HOTSPOT_SMOKE_ENABLED: ${AI_HOTSPOT_SMOKE_ENABLED:-true}
      OUTBOX_ENABLED: ${OUTBOX_ENABLED:-true}
      OUTBOX_FIXED_DELAY_MS: ${OUTBOX_FIXED_DELAY_MS:-1000}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-20}
      CRAWL_SCHEDULER_ENABLED: ${CRAWL_SCHEDULER_ENABLED:-true}
      CRAWL_SCHEDULER_FIXED_DELAY_MS: ${CRAWL_SCHEDULER_FIXED_DELAY_MS:-10000}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
      MAIL_FROM: ${MAIL_FROM:-AI Hotspot <no-reply@ai-hotspot.local>}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-true}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@aihotspot.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-change-me-before-use}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-AI Hotspot 管理员}
      SOURCE_CATALOG_ENABLED: ${SOURCE_CATALOG_ENABLED:-true}
      SOURCE_CATALOG_OWNER_EMAIL: ${SOURCE_CATALOG_OWNER_EMAIL:-admin@aihotspot.local}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      ai-api: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      AI_HOTSPOT_ENV: ${AI_HOTSPOT_ENV:-development}
      AI_HOTSPOT_VERSION: ${AI_HOTSPOT_VERSION:-0.1.0}
      CORE_API_INTERNAL_URL: ${CORE_API_INTERNAL_URL:-http://core-api:8080}
      NEXT_PUBLIC_CORE_API_URL: ${NEXT_PUBLIC_CORE_API_URL:-/api/core}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      core-api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [frontend, backend]

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web: { condition: service_healthy }
      core-api: { condition: service_healthy }
    restart: unless-stopped
    networks: [frontend, backend]

networks:
  frontend:
  backend:

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  mailpit-data:
