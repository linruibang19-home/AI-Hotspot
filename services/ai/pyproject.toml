[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ai-hotspot-ai"
version = "0.1.0"
description = "AI Hotspot AI API and worker foundation"
requires-python = ">=3.12"
dependencies = [
  "aio-pika==9.5.7",
  "fastapi==0.139.2",
  "feedparser==6.0.12",
  "httpx==0.28.1",
  "minio==7.2.20",
  "psycopg[binary]==3.3.2",
  "pydantic-settings==2.14.2",
  "redis==7.3.0",
  "sqlalchemy==2.0.51",
  "structlog==25.5.0",
  "uvicorn[standard]==0.51.0"
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.7"
]

[project.scripts]
ai-hotspot-api = "ai_hotspot_ai.main:run"
ai-hotspot-worker = "ai_hotspot_ai.worker:run"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_hotspot_ai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
