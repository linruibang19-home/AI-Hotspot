spring:
  datasource:
    url: jdbc:h2:mem:aihotspot;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  mvc:
    problemdetails:
      enabled: true
  flyway:
    enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false

ai-hotspot:
  environment: test
  version: test
  ai-base-url: http://localhost:8000
  outbox:
    enabled: false
    fixed-delay: 60000
    batch-size: 20
  mail:
    provider: mock
    from: no-reply@ai-hotspot.local
